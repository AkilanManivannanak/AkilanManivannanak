name: Contribution visuals

# Builds the contribution snake and publishes it to the `snake` branch, which the README
# reads from. The 3D contribution chart is drawn by scripts/showcase.py in the README job.
on:
  schedule:
    - cron: "15 7,19 * * *"   # twice a day, 2:15 and 14:15 New York time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: contribution-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#b4531a&color_dots=#ebe7df,#cfe8e2,#8fcfc2,#3fb8a6,#1f8878
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e0873a&color_dots=#11171d,#123a35,#1c5f55,#2c8f80,#3fb8a6

      # Plain git instead of a publishing action: one fresh commit, force-pushed, with
      # retries, so a transient network error or a concurrent push cannot fail the run.
      - name: Publish to the snake branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Work on a copy: files written by the snake action may not be owned by the runner user.
          out="$RUNNER_TEMP/snake-out"
          rm -rf "$out" && mkdir -p "$out"
          cp dist/*.svg "$out"/
          cd "$out"
          ls -la
          git init -q -b snake
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: refresh contribution visuals"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            if git push -f "$url" snake; then exit 0; fi
            echo "push failed, retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
