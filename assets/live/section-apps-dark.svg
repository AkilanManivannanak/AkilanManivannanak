<text x="40" y="40" fill="#f2efe9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="750" letter-spacing="-.3">Software &amp; web apps</text>
