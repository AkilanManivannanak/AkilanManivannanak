<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="FashionFinder: Visual search for fashion: CLIP and ResNet18 embeddings indexed in FAISS for Pinterest-style similarity search. Live demo."><title>FashionFinder: Visual search for fashion: CLIP and ResNet18 embeddings indexed in FAISS for Pinterest-style similarity search. Live demo.</title><rect width="400" height="178" fill="#f5f3ef"/>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#2f7cc0" stop-opacity="0"/><stop offset=".5" stop-color="#2f7cc0"/><stop offset="1" stop-color="#2f7cc0" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k"><rect x="1" y="1" width="398" height="176" rx="14"/></clipPath>
</defs>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.96s" dur=".55s" fill="freeze"/>
  <rect x="1" y="1" width="398" height="176" rx="14" fill="#ffffff" stroke="#d8d3c9"/>
  <g clip-path="url(#k)">
    <rect x="0" y="0" width="5" height="178" fill="#2f7cc0"/>
    <rect x="-160" y="0" width="160" height="2.5" fill="url(#g)">
      <animate attributeName="x" from="-160" to="400" begin="1.36s" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="22" y="38" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="-.2">FashionFinder</text>
  <text x="22" y="58" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">AkilanManivannanak/FashionFinder</text>
  
  <text x="22" y="86" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">Visual search for fashion: CLIP and ResNet18</text><text x="22" y="105" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">embeddings indexed in FAISS for Pinterest-style</text><text x="22" y="124" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">similarity search. Live demo.</text>
  <rect x="22" y="140" width="44" height="22" rx="11" fill="#2f7cc0" fill-opacity=".13" stroke="#2f7cc0" stroke-opacity=".4"/><text x="30" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">CLIP</text><rect x="72" y="140" width="50" height="22" rx="11" fill="#2f7cc0" fill-opacity=".13" stroke="#2f7cc0" stroke-opacity=".4"/><text x="80" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">FAISS</text><rect x="128" y="140" width="64" height="22" rx="11" fill="#2f7cc0" fill-opacity=".13" stroke="#2f7cc0" stroke-opacity=".4"/><text x="136" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">PyTorch</text>
  <text x="380" y="156" text-anchor="end" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Nov 2026</text>
</g></svg>
