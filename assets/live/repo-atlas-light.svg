<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="ATLAS-Σ: Research simulator for financial infrastructure, modelling institutions, payment obligations, settlement and disruptions."><title>ATLAS-Σ: Research simulator for financial infrastructure, modelling institutions, payment obligations, settlement and disruptions.</title><rect width="400" height="178" fill="#f5f3ef"/>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#9a7a12" stop-opacity="0"/><stop offset=".5" stop-color="#9a7a12"/><stop offset="1" stop-color="#9a7a12" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k"><rect x="1" y="1" width="398" height="176" rx="14"/></clipPath>
</defs>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.12s" dur=".55s" fill="freeze"/>
  <rect x="1" y="1" width="398" height="176" rx="14" fill="#ffffff" stroke="#d8d3c9"/>
  <g clip-path="url(#k)">
    <rect x="0" y="0" width="5" height="178" fill="#9a7a12"/>
    <rect x="-160" y="0" width="160" height="2.5" fill="url(#g)">
      <animate attributeName="x" from="-160" to="400" begin="0.52s" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="22" y="38" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="-.2">ATLAS-Σ</text>
  <text x="22" y="58" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">AkilanManivannanak/ATLAS</text>
  <rect x="336" y="18" width="44" height="20" rx="10" fill="#1f8878"><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></rect><text x="358" y="32" text-anchor="middle" fill="#f5f3ef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">NEW</text>
  <text x="22" y="86" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">Research simulator for financial</text><text x="22" y="105" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">infrastructure, modelling institutions, payment</text><text x="22" y="124" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">obligations, settlement and disruptions.</text>
  <rect x="22" y="140" width="92" height="22" rx="11" fill="#9a7a12" fill-opacity=".13" stroke="#9a7a12" stroke-opacity=".4"/><text x="30" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Python 3.12</text>
  <text x="380" y="156" text-anchor="end" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Nov 2026</text>
</g></svg>
