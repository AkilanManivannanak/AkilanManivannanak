<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="Real-Time ASL Recognition: Real-time ASL fingerspelling recognition, A to Z, from a webcam feed."><title>Real-Time ASL Recognition: Real-time ASL fingerspelling recognition, A to Z, from a webcam feed.</title><rect width="400" height="178" fill="#f5f3ef"/>
