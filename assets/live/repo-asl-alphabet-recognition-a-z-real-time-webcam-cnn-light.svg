  <text x="22" y="58" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">AkilanManivannanak/ASL-Alphabet-Recognition_A-Z_-Re…</text>
  
  <text x="22" y="86" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">Real-time ASL fingerspelling recognition, A to</text><text x="22" y="105" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">Z, from a webcam feed.</text>
  <rect x="22" y="140" width="85" height="22" rx="11" fill="#8a5fb0" fill-opacity=".13" stroke="#8a5fb0" stroke-opacity=".4"/><text x="30" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">TensorFlow</text><rect x="113" y="140" width="57" height="22" rx="11" fill="#8a5fb0" fill-opacity=".13" stroke="#8a5fb0" stroke-opacity=".4"/><text x="121" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">OpenCV</text>
  <text x="380" y="156" text-anchor="end" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Nov 2026</text>
