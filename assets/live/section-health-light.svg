<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Healthcare &amp; biomedical AI: 4 repositories"><title>Healthcare &amp; biomedical AI: 4 repositories</title>
<circle cx="18" cy="32" r="7" fill="#c0392b"/>
<circle cx="18" cy="32" r="7" fill="none" stroke="#c0392b">
  <animate attributeName="r" values="7;18" dur="2.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
</circle>
<text x="40" y="40" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="750" letter-spacing="-.3">Healthcare &amp; biomedical AI</text>
<rect x="418" y="18" width="90" height="28" rx="14" fill="#c0392b" fill-opacity=".14" stroke="#c0392b" stroke-opacity=".5"/>
<text x="432" y="37" fill="#c0392b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">4 repos</text>
<line x1="538" y1="32" x2="1196" y2="32" stroke="#d8d3c9" stroke-width="2"/>
