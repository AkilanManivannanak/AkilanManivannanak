<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="Guardian Drive: Driver-safety stack: eight hazard detectors fused with BEV perception under a safety state machine. Cardiac AUC 0.961."><title>Guardian Drive: Driver-safety stack: eight hazard detectors fused with BEV perception under a safety state machine. Cardiac AUC 0.961.</title><rect width="400" height="178" fill="#f5f3ef"/>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#b4531a" stop-opacity="0"/><stop offset=".5" stop-color="#b4531a"/><stop offset="1" stop-color="#b4531a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k"><rect x="1" y="1" width="398" height="176" rx="14"/></clipPath>
</defs>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.12s" dur=".55s" fill="freeze"/>
  <rect x="1" y="1" width="398" height="176" rx="14" fill="#ffffff" stroke="#d8d3c9"/>
  <g clip-path="url(#k)">
