<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="OpenDriveFM: Camera-only BEV occupancy and 6 s trajectory prediction on nuScenes with per-camera trust scoring. Fault AUROC 0.764 at 71.2 FPS."><title>OpenDriveFM: Camera-only BEV occupancy and 6 s trajectory prediction on nuScenes with per-camera trust scoring. Fault AUROC 0.764 at 71.2 FPS.</title><rect width="400" height="178" fill="#07090c"/>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#e0873a" stop-opacity="0"/><stop offset=".5" stop-color="#e0873a"/><stop offset="1" stop-color="#e0873a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k"><rect x="1" y="1" width="398" height="176" rx="14"/></clipPath>
</defs>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.00s" dur=".55s" fill="freeze"/>
  <rect x="1" y="1" width="398" height="176" rx="14" fill="#0d1217" stroke="#1d2a34"/>
  <g clip-path="url(#k)">
