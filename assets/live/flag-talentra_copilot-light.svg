<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Talentra Copilot: five agents, p95 4.81 ms against a 1.5 s SLO"><title>Talentra Copilot: five agents, p95 4.81 ms against a 1.5 s SLO</title><rect width="600" height="320" fill="#f5f3ef"/>
