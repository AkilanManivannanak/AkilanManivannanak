<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Autonomous driving &amp; BEV: 5 repositories"><title>Autonomous driving &amp; BEV: 5 repositories</title>
<circle cx="18" cy="32" r="7" fill="#b4531a"/>
<circle cx="18" cy="32" r="7" fill="none" stroke="#b4531a">
  <animate attributeName="r" values="7;18" dur="2.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
</circle>
<text x="40" y="40" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="750" letter-spacing="-.3">Autonomous driving &amp; BEV</text>
<rect x="392" y="18" width="90" height="28" rx="14" fill="#b4531a" fill-opacity=".14" stroke="#b4531a" stroke-opacity=".5"/>
<text x="406" y="37" fill="#b4531a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">5 repos</text>
<line x1="512" y1="32" x2="1196" y2="32" stroke="#d8d3c9" stroke-width="2"/>
<line x1="512" y1="32" x2="512" y2="32" stroke="#b4531a" stroke-width="2">
  <animate attributeName="x2" values="512;1196" dur="1.4s" fill="freeze"/>
</line>
<circle cx="1196" cy="32" r="3" fill="#b4531a" opacity="0">
