  <text x="22" y="58" fill="#6f7b86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">AkilanManivannanak/stock-forecasting-aapl-LSTM-RAG</text>
  
  <text x="22" y="86" fill="#98a1ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">AAPL forecasting with LSTM and baselines, plus</text><text x="22" y="105" fill="#98a1ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">a strictly grounded RAG copilot. MAPE 3.34%, 0%</text><text x="22" y="124" fill="#98a1ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">hallucination.</text>
  <rect x="22" y="140" width="44" height="22" rx="11" fill="#d9b44a" fill-opacity=".13" stroke="#d9b44a" stroke-opacity=".4"/><text x="30" y="155" fill="#f2efe9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">LSTM</text><rect x="72" y="140" width="71" height="22" rx="11" fill="#d9b44a" fill-opacity=".13" stroke="#d9b44a" stroke-opacity=".4"/><text x="80" y="155" fill="#f2efe9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">ChromaDB</text><rect x="149" y="140" width="64" height="22" rx="11" fill="#d9b44a" fill-opacity=".13" stroke="#d9b44a" stroke-opacity=".4"/><text x="157" y="155" fill="#f2efe9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">FastAPI</text>
