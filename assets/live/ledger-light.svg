<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 364" width="1200" height="364" role="img" aria-label="Improvement log: before and after metrics"><title>Improvement log: before and after metrics</title><rect width="1200" height="364" fill="#f5f3ef"/>
<rect x="1" y="1" width="1198" height="362" rx="16" fill="#ffffff" stroke="#d8d3c9"/>
<text x="32" y="46" fill="#b4531a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">IMPROVEMENT LOG · MEASURED BEFORE AND AFTER</text>
<text x="32" y="72" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14">Each bar grows from the first version to the current one. Every number comes from the repo's own evaluation scripts.</text>

<text x="32" y="118" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="650">Camera-trust AUROC</text>
<text x="32" y="138" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">opendrivefm · trust scorer recalibrated</text>
