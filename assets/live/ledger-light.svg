<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 364" width="1200" height="364" role="img" aria-label="Regression ledger: published numbers versus fixed numbers"><title>Regression ledger: published numbers versus fixed numbers</title><rect width="1200" height="364" fill="#f5f3ef"/>
<rect x="1" y="1" width="1198" height="362" rx="16" fill="#ffffff" stroke="#d8d3c9"/>
<text x="32" y="46" fill="#b4531a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6">REGRESSION LEDGER · BUGS I CAUGHT IN MY OWN PUBLISHED NUMBERS</text>
<text x="32" y="72" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14">Red is what I first published. Green is the number after my own tooling found the bug. Both stay on the record.</text>

<text x="32" y="118" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="650">Trust-scorer AUROC</text>
