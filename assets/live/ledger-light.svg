</rect>
<text x="990" y="185" fill="#c0392b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-decoration="line-through">0.487</text>
<text x="1044" y="185" fill="#1f8878" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">→ 0.689</text>
