<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Finance &amp; forecasting: 3 repositories"><title>Finance &amp; forecasting: 3 repositories</title>
<circle cx="18" cy="32" r="7" fill="#d9b44a"/>
<circle cx="18" cy="32" r="7" fill="none" stroke="#d9b44a">
  <animate attributeName="r" values="7;18" dur="2.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
</circle>
<text x="40" y="40" fill="#f2efe9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="750" letter-spacing="-.3">Finance &amp; forecasting</text>
<rect x="353" y="18" width="90" height="28" rx="14" fill="#d9b44a" fill-opacity=".14" stroke="#d9b44a" stroke-opacity=".5"/>
<text x="367" y="37" fill="#d9b44a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">3 repos</text>
<line x1="473" y1="32" x2="1196" y2="32" stroke="#1d2a34" stroke-width="2"/>
<line x1="473" y1="32" x2="473" y2="32" stroke="#d9b44a" stroke-width="2">
  <animate attributeName="x2" values="473;1196" dur="1.4s" fill="freeze"/>
</line>
<circle cx="1196" cy="32" r="3" fill="#d9b44a" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="1.3s" dur=".3s" fill="freeze"/>
</circle></svg>
