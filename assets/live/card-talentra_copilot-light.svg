<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Talentra Copilot: 4.81ms p95 vs 1.5 s SLO"><title>Talentra Copilot: 4.81ms p95 vs 1.5 s SLO</title><rect width="600" height="300" fill="#f5f3ef"/>
<defs>
  <linearGradient id="sh" x1="0" x2="1">
    <stop offset="0" stop-color="#1f8878" stop-opacity="0"/>
    <stop offset=".5" stop-color="#1f8878" stop-opacity=".9"/>
    <stop offset="1" stop-color="#1f8878" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cl"><rect x="1" y="1" width="598" height="298" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="298" rx="16" fill="#ffffff" stroke="#d8d3c9"/>
<g clip-path="url(#cl)">
  <rect x="0" y="0" width="600" height="4" fill="#1f8878" opacity=".35"/>
  <rect x="-220" y="0" width="220" height="4" fill="url(#sh)">
    <animate attributeName="x" from="-220" to="600" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <!-- slow radar sweep behind the gauge -->
  <g transform="translate(468 128)" opacity=".10">
    <path d="M0 0 L84 0 A84 84 0 0 0 72.7 -42 Z" fill="#1f8878">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
<text x="32" y="44" fill="#1f8878" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4">LANGGRAPH · FASTAPI · PROMETHEUS</text>
<circle cx="566" cy="40" r="5" fill="#1f8878">
  <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<text x="554" y="44" text-anchor="end" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">LIVE REPO</text>
<text x="32" y="92" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-.6">Talentra Copilot</text>
<text x="32" y="132" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">Five agents: screener, ranker, interviewer,</text><text x="32" y="154" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">bias auditor, copilot. Fallback at every</text><text x="32" y="176" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15">layer.</text>
<g transform="translate(468 128)">
  <circle r="56" fill="none" stroke="#d8d3c9" stroke-width="9"/>
  <circle r="56" fill="none" stroke="#1f8878" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="351.9" stroke-dashoffset="351.9" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" values="351.9;1.1;1.1;351.9"
             keyTimes="0;.28;.88;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text y="7" text-anchor="middle" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">4.81ms</text>
  <text y="84" text-anchor="middle" fill="#5b626b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">p95 vs 1.5 s SLO</text>
</g>
<line x1="32" y1="226" x2="568" y2="226" stroke="#d8d3c9"/>
<text x="32" y="252" fill="#1f8878" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">▲ $0.000 / request</text>
<text x="32" y="276" fill="#c0392b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">▼ fails at: top-1 measured on a fixture</text>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f8878">
  <text x="540" y="266" text-anchor="end">Open repo</text>
  <text x="548" y="266">→
    <animate attributeName="x" values="548;556;548" dur="1.4s" repeatCount="indefinite"/>
  </text>
</g></svg>
