<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 178" width="400" height="178" role="img" aria-label="Endoscopy Abnormality AI: Multi-task EfficientNet-B3 that flags gastrointestinal abnormalities in endoscopy images in real time."><title>Endoscopy Abnormality AI: Multi-task EfficientNet-B3 that flags gastrointestinal abnormalities in endoscopy images in real time.</title><rect width="400" height="178" fill="#f5f3ef"/>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#c0392b" stop-opacity="0"/><stop offset=".5" stop-color="#c0392b"/><stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="k"><rect x="1" y="1" width="398" height="176" rx="14"/></clipPath>
</defs>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" begin="0.12s" dur=".55s" fill="freeze"/>
  <rect x="1" y="1" width="398" height="176" rx="14" fill="#ffffff" stroke="#d8d3c9"/>
  <g clip-path="url(#k)">
    <rect x="0" y="0" width="5" height="178" fill="#c0392b"/>
    <rect x="-160" y="0" width="160" height="2.5" fill="url(#g)">
      <animate attributeName="x" from="-160" to="400" begin="0.52s" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="22" y="38" fill="#14171c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="-.2">Endoscopy Abnormality AI</text>
  <text x="22" y="58" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">AkilanManivannanak/Esophageal-Cancer-Detection</text>
  
  <text x="22" y="86" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">Multi-task EfficientNet-B3 that flags</text><text x="22" y="105" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">gastrointestinal abnormalities in endoscopy</text><text x="22" y="124" fill="#5b626b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2">images in real time.</text>
  <rect x="22" y="140" width="120" height="22" rx="11" fill="#c0392b" fill-opacity=".13" stroke="#c0392b" stroke-opacity=".4"/><text x="30" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">EfficientNet-B3</text><rect x="148" y="140" width="64" height="22" rx="11" fill="#c0392b" fill-opacity=".13" stroke="#c0392b" stroke-opacity=".4"/><text x="156" y="155" fill="#14171c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">PyTorch</text>
  <text x="380" y="156" text-anchor="end" fill="#7d838b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Nov 2026</text>
</g></svg>
