<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Akilan Manivannan, camera-only BEV perception. An animated bird's-eye-view occupancy grid with six camera frustums sweeping around an ego vehicle." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Akilan Manivannan — camera-only BEV perception</title>
  <style>
    .ground   { fill: none; stroke: #1d2a34; stroke-width: 1; }
    .ground-f { fill: none; stroke: #16212a; stroke-width: 1; }
    .spoke    { stroke: #16212a; stroke-width: 1; }
    .cam      { fill: #5aa9e6; opacity: .13; }
    .camline  { stroke: #5aa9e6; stroke-width: 1; fill: none; opacity: .5; }
    .occ      { fill: #e0873a; }
    .free     { fill: #3fb8a6; }
    .crit     { fill: #e2574c; }
    .ego      { fill: #e8e6e2; }
    .egoline  { stroke: #0b0e12; stroke-width: 1; }
    .h1       { fill: #f2efe9; font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -1.2px; }
    .h2       { fill: #e0873a; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 2.6px; }
    .sub      { fill: #98a1ab; font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 15px; }
    .read     { fill: #6f7b86; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: .4px; }
    .readv    { fill: #3fb8a6; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: .4px; }
    .rule     { stroke: #1d2a34; stroke-width: 1; }
  </style>

  <defs>
    <radialGradient id="sweepGrad" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#e0873a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#e0873a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#07090c" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#07090c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#07090c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="#07090c"/>

  <!-- ================= BEV instrument ================= -->
  <g transform="translate(830 176)">
    <g transform="scale(1 0.52)">

      <!-- range rings -->
      <circle class="ground-f" r="330"/>
      <circle class="ground"   r="252"/>
      <circle class="ground-f" r="174"/>
      <circle class="ground"   r="96"/>
      <circle class="ground-f" r="34"/>

      <!-- radial spokes every 30 deg -->
      <g class="spoke">
        <line x1="-336" y1="0" x2="336" y2="0"/>
        <line x1="0" y1="-336" x2="0" y2="336"/>
        <line x1="-291" y1="-168" x2="291" y2="168"/>
        <line x1="-291" y1="168"  x2="291" y2="-168"/>
        <line x1="-168" y1="-291" x2="168" y2="291"/>
        <line x1="-168" y1="291"  x2="168" y2="-291"/>
      </g>

      <!-- six camera frustums, pulsing in capture order -->
      <g>
        <g>
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="0s" repeatCount="indefinite"/>
        </g>
        <g transform="rotate(60)">
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="0.7s" repeatCount="indefinite"/>
        </g>
        <g transform="rotate(120)">
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
        </g>
        <g transform="rotate(180)">
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
        </g>
        <g transform="rotate(240)">
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
        </g>
        <g transform="rotate(300)">
          <path class="cam"     d="M0 0 L-78 -300 L78 -300 Z"/>
          <path class="camline" d="M-78 -300 L0 0 L78 -300"/>
          <animate attributeName="opacity" values=".35;1;.35" dur="4.2s" begin="3.5s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- occupancy cells -->
      <g>
        <rect class="occ"  x="86"   y="-152" width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".18;.92;.18" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></rect>
        <rect class="occ"  x="128"  y="-118" width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".18;.75;.18" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></rect>
        <rect class="crit" x="-166" y="-84"  width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".25;1;.25"   dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
        <rect class="occ"  x="-208" y="-50"  width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".15;.7;.15"  dur="3.6s" begin="1.3s" repeatCount="indefinite"/></rect>
        <rect class="free" x="-58"  y="150"  width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".12;.6;.12"  dur="4.4s" begin="0.4s" repeatCount="indefinite"/></rect>
        <rect class="free" x="-16"  y="184"  width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".12;.55;.12" dur="4.4s" begin="0.8s" repeatCount="indefinite"/></rect>
        <rect class="occ"  x="196"  y="42"   width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".15;.8;.15"  dur="2.8s" begin="1.7s" repeatCount="indefinite"/></rect>
        <rect class="occ"  x="238"  y="76"   width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".12;.5;.12"  dur="2.8s" begin="2.0s" repeatCount="indefinite"/></rect>
        <rect class="crit" x="-124" y="204"  width="34" height="34" rx="2">
          <animate attributeName="opacity" values=".2;.85;.2"   dur="3.3s" begin="2.4s" repeatCount="indefinite"/></rect>
      </g>

      <!-- predicted trajectory, three modes -->
      <g fill="none" stroke-linecap="round">
        <path d="M0 0 C 40 -90, 90 -170, 128 -268" stroke="#3fb8a6" stroke-width="5" opacity=".9"
              stroke-dasharray="16 14">
          <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M0 0 C 12 -96, 8 -186, -6 -276" stroke="#3fb8a6" stroke-width="3" opacity=".4"
              stroke-dasharray="12 12">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.9s" repeatCount="indefinite"/>
        </path>
        <path d="M0 0 C 66 -74, 148 -118, 232 -150" stroke="#3fb8a6" stroke-width="3" opacity=".28"
              stroke-dasharray="12 12">
          <animate attributeName="stroke-dashoffset" from="48" to="0" dur="2.3s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- sweep -->
      <g>
        <path d="M0 0 L0 -330 A330 330 0 0 1 165 -286 Z" fill="url(#sweepGrad)"/>
        <line x1="0" y1="0" x2="0" y2="-330" stroke="#e0873a" stroke-width="1.5" opacity=".55"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>

      <!-- ego vehicle -->
      <g>
        <ellipse class="ego" rx="17" ry="27" opacity=".92"/>
        <ellipse rx="17" ry="27" fill="none" stroke="#07090c" stroke-width="2"/>
        <circle r="46" fill="none" stroke="#e8e6e2" stroke-width="1" opacity=".35">
          <animate attributeName="r" values="30;92;30" dur="3.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".45;0;.45" dur="3.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- left-side legibility fade over the instrument -->
  <rect width="700" height="340" fill="url(#fade)"/>

  <!-- ================= identity ================= -->
  <g transform="translate(64 96)">
    <text class="h2" y="0">CAMERA-ONLY BEV PERCEPTION</text>
    <text class="h1" y="52">Akilan Manivannan</text>
    <text class="sub" y="86">MS Artificial Intelligence, LIU Brooklyn. I build perception</text>
    <text class="sub" y="108">systems and the harnesses that prove they are wrong.</text>

    <line class="rule" x1="0" y1="140" x2="470" y2="140"/>

    <g transform="translate(0 166)">
      <text class="read"  x="0"   y="0">FAULT AUROC</text>
      <text class="readv" x="0"   y="20">0.764</text>
      <text class="read"  x="0"   y="36" opacity=".7">[0.750, 0.777]</text>

      <text class="read"  x="150" y="0">C++ RUNTIME</text>
      <text class="readv" x="150" y="20">71.2 FPS</text>
      <text class="read"  x="150" y="36" opacity=".7">p50 13.9 ms</text>

      <text class="read"  x="300" y="0">nuScenes ADE</text>
      <text class="readv" x="300" y="20">3.159 m</text>
      <text class="read"  x="300" y="36" opacity=".7">6-camera rig</text>
    </g>
  </g>

  <!-- scanning tick along the baseline -->
  <g>
    <line x1="0" y1="338" x2="1200" y2="338" stroke="#131b22" stroke-width="2"/>
    <line x1="0" y1="338" x2="150" y2="338" stroke="#e0873a" stroke-width="2" opacity=".8">
      <animate attributeName="x1" values="-150;1200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1350"    dur="9s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
