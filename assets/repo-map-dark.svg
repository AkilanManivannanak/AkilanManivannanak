<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Map of 34 repositories. One camera-only BEV encoder feeds three autonomous driving systems; five other domain clusters sit alongside." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Repository map — one encoder, three systems, six domains</title>
  <style>
    .panel  { fill: #0d1116; stroke: #1d2a34; stroke-width: 1; }
    .core   { fill: #16110b; stroke: #e0873a; stroke-width: 1.5; }
    .wire   { stroke: #2a3540; }
    .lbl    { fill: #6f7b86; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 1.6px; }
    .name   { fill: #f2efe9; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; }
    .desc   { fill: #8b939c; font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif; font-size: 12px; }
    .metric { fill: #3fb8a6; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; }
    .corename { fill: #e0873a; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; letter-spacing: .3px; }
    .count  { fill: #f2efe9; font-family: "Archivo", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 22px; }
    .h      { fill: #f2efe9; font-family: "Archivo", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; }
    .hint   { fill: #5c666f; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: 1.2px; }
  </style>

  <rect width="1200" height="470" fill="#07090c"/>

  <text class="h"    x="40" y="42">One encoder, three systems</text>
  <text class="hint" x="40" y="62">34 PUBLIC REPOSITORIES · SEPTEMBER 2026</text>

  <!-- ============ core encoder ============ -->
  <g>
    <rect class="core" x="40" y="122" width="252" height="188" rx="3"/>
    <text class="lbl"      x="60" y="152">SHARED CORE</text>
    <text class="corename" x="60" y="180">OpenDriveFM</text>
    <text class="desc"     x="60" y="204">Camera-only BEV encoder</text>
    <text class="desc"     x="60" y="222">6 surround cameras → occupancy</text>
    <text class="desc"     x="60" y="240">nuScenes · TorchScript · C++</text>
    <line x1="60" y1="258" x2="272" y2="258" stroke="#3a2a16" stroke-width="1"/>
    <text class="metric"   x="60" y="280">184.6M params · 71.2 FPS</text>
    <text class="metric"   x="60" y="298" opacity=".75">p50 13.9 ms · 4 CPU threads</text>
  </g>

  <!-- ============ wires ============ -->
  <g fill="none" stroke="#e0873a" stroke-width="1.5" opacity=".55">
    <path d="M292 168 C 340 168, 340 130, 392 130"/>
    <path d="M292 216 C 348 216, 348 216, 392 216"/>
    <path d="M292 264 C 340 264, 340 302, 392 302"/>
  </g>
  <g fill="#e0873a">
    <circle cx="392" cy="130" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="392" cy="216" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="302" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ three AV systems ============ -->
  <g>
    <rect class="panel" x="400" y="104" width="330" height="66" rx="3"/>
    <text class="name"   x="418" y="130">opendrivefm</text>
    <text class="desc"   x="418" y="150">Trust scoring + fault-injection harness</text>
    <text class="metric" x="700" y="130" text-anchor="end">11 ★</text>
  </g>
  <g>
    <rect class="panel" x="400" y="190" width="330" height="66" rx="3"/>
    <text class="name"   x="418" y="216">guardian-drive</text>
    <text class="desc"   x="418" y="236">8 hazard detectors fused with BEV</text>
    <text class="metric" x="712" y="216" text-anchor="end">AUC 0.961</text>
  </g>
  <g>
    <rect class="panel" x="400" y="276" width="330" height="66" rx="3"/>
    <text class="name"   x="418" y="302">autonomy-vision</text>
    <text class="desc"   x="418" y="322">Trucking stack, guardrails, fallbacks</text>
    <text class="metric" x="712" y="302" text-anchor="end">ADE 18.78 m</text>
  </g>

  <!-- ============ other domains ============ -->
  <text class="hint" x="790" y="96">OTHER DOMAINS</text>

  <g>
    <rect class="panel" x="790" y="112" width="370" height="52" rx="3"/>
    <text class="count" x="810" y="146">6</text>
    <text class="name"  x="848" y="136">Agentic AI · LLM · RAG</text>
    <text class="desc"  x="848" y="152">talentra · neurapilot · phamilyops · attentive-flow</text>
  </g>
  <g>
    <rect class="panel" x="790" y="176" width="370" height="52" rx="3"/>
    <text class="count" x="810" y="210">2</text>
    <text class="name"  x="848" y="200">Retrieval &amp; ranking</text>
    <text class="desc"  x="848" y="216">CineWave two-stage · FashionFinder</text>
  </g>
  <g>
    <rect class="panel" x="790" y="240" width="370" height="52" rx="3"/>
    <text class="count" x="810" y="274">4</text>
    <text class="name"  x="848" y="264">Healthcare &amp; biomedical</text>
    <text class="desc"  x="848" y="280">Endoscopy EfficientNet-B3 · 17-condition screen</text>
  </g>
  <g>
    <rect class="panel" x="790" y="304" width="370" height="52" rx="3"/>
    <text class="count" x="810" y="338">4</text>
    <text class="name"  x="848" y="328">Speech · vision · signal</text>
    <text class="desc"  x="848" y="344">Noise-robust KWS · ASL real-time CNN</text>
  </g>
  <g>
    <rect class="panel" x="790" y="368" width="370" height="52" rx="3" opacity=".55"/>
    <text class="count" x="810" y="402" opacity=".55">9</text>
    <text class="name"  x="848" y="392" opacity=".55">Coursework, forks &amp; profile</text>
    <text class="desc"  x="848" y="408" opacity=".55">Archived weight, kept for provenance</text>
  </g>

  <line x1="40" y1="428" x2="730" y2="428" stroke="#1d2a34" stroke-width="1"/>
  <text class="hint" x="40" y="450">EVERY FIGURE ABOVE IS PRODUCED BY A SCRIPT IN THE REPO IT DESCRIBES</text>
</svg>
